<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0c0e'/><text x='6' y='23' font-family='monospace' font-size='20' fill='%23c9a15a'>&gt;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0b0c0e;
    --bg-raised: #0f1012;
    --line: #242628;
    --text: #d8dcd8;
    --text-dim: #6b7078;
    --accent: #c9a15a;
    --user-bubble: #1a2a1e;
    --user-text: #6ee7a0;
    --user-border: #2a5c3a;
    --error: #b5544a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Balsamiq Sans', cursive;
    font-size: 16px;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-raised);
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .titlebar .left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .titlebar .clock {
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .titlebar .right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .titlebar .github {
    color: var(--text-dim);
    text-decoration: none;
    display: flex;
    align-items: center;
    padding: 4px 6px;
    transition: color 0.18s;
  }

  .titlebar .github:hover {
    color: var(--accent);
  }

  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 28px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  #chat::-webkit-scrollbar {
    width: 8px;
  }
  #chat::-webkit-scrollbar-thumb {
    background: var(--line);
  }

  .line {
    margin-bottom: 18px;
    max-width: 900px;
  }

  /* AI message: left-aligned with accent border */
  .line.agent {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: 860px;
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    gap: 4px;
  }

  .agent-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    user-select: none;
  }

  /* hide .prompt span - no longer used for agent */
  .agent .prompt { display: none; }
  .line.you {
    display: flex;
    justify-content: flex-end;
    max-width: 100%;
  }

  .line.you .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--user-border);
    color: var(--user-text);
    padding: 8px 14px;
    max-width: 72%;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.95em;
    line-height: 1.55;
  }

  .prompt {
    color: var(--accent);
  }

  .agent .prompt {
    color: var(--text-dim);
  }

  .cache-tag {
    color: var(--accent);
    font-size: 11px;
    margin-left: 6px;
    opacity: 0.8;
    letter-spacing: 0.04em;
  }

  .tool-call {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 8px;
    max-width: 900px;
  }

  .system-line {
    color: var(--text-dim);
    font-size: 14px;
  }

  .error-card {
    border-left: 2px solid var(--error);
    padding: 8px 14px;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .error-card .error-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--error);
    opacity: 0.85;
    user-select: none;
  }

  .error-card .error-body {
    color: #e07070;
    font-size: 0.95em;
    line-height: 1.5;
  }

  .body { color: var(--text); }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin-bottom: 0; }
  .body strong { color: #fff; font-weight: 600; }
  .body em { font-style: italic; }
  .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; }
  .body li { margin-bottom: 4px; }
  .body a { color: var(--accent); text-decoration: underline; }
  .body code {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 1px 5px;
    font-size: 0.9em;
    color: var(--accent);
  }
  .body pre {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .body pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
  }
  .body blockquote {
    border-left: 2px solid var(--line);
    margin: 0 0 10px;
    padding-left: 12px;
    color: var(--text-dim);
  }
  .body h1, .body h2, .body h3 {
    color: var(--text);
    margin: 0 0 8px;
    font-size: 1.05em;
  }

  .streaming .body::after {
    content: '';
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-start infinite;
    vertical-align: -2px;
  }

  .inputrow {
    display: flex;
    align-items: center;
    border-top: 1px solid var(--line);
    padding: 16px 24px;
    gap: 10px;
    flex-shrink: 0;
  }

  .inputrow .prompt {
    color: var(--accent);
    flex-shrink: 0;
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    caret-color: var(--accent);
  }

  #input::placeholder {
    color: var(--text-dim);
  }


  @keyframes blink {
    50% { opacity: 0; }
  }

  .hint {
    width: 100%;
    padding: 10px 24px;
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    box-sizing: border-box;
  }

  @media (max-width: 600px) {
    body { font-size: 14px; }
    #chat { padding: 18px; }
    .titlebar { padding: 10px 16px; }
    .titlebar .left { gap: 10px; }
    .titlebar span:not(.clock) { font-size: 12px; }
    .titlebar .github span.label { display: none; }
    .inputrow { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="titlebar">
    <span class="left">
      <span>agent - gemini-3.6-flash</span>
      <span class="clock" id="clock"></span>
    </span>
    <span class="right">
      <a class="github" href="https://github.com/ShiiiivanshSingh/tinyAI" target="_blank" rel="noopener noreferrer" title="View on GitHub">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </span>
  </div>
  <div id="chat"></div>
  <div class="inputrow">
    <span class="prompt">&gt;</span>
    <input id="input" type="text" placeholder="type a message - /clear to start over" autocomplete="off" autofocus />
  </div>
</div>

<div class="hint">
  <span id="threadLabel">thread: {{ session_id[:8] }}</span>
  <span id="callCount">api calls: 0</span>
</div>

<script>
let sessionId = "{{ session_id }}";
const chatDiv = document.getElementById("chat");
const input = document.getElementById("input");
const threadLabel = document.getElementById("threadLabel");
const callCountLabel = document.getElementById("callCount");

marked.setOptions({ breaks: true });

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("clock").textContent = `${h}:${m}:${s}`;
}
updateClock();
setInterval(updateClock, 1000);

function addLine(role, text) {
  const line = document.createElement("div");
  line.className = "line " + role;
  if (role === "you") {
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    line.appendChild(bubble);
  } else {
    // agent: label + body, no dot
    const label = document.createElement("div");
    label.className = "agent-label";
    label.textContent = "gemini";
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    line.appendChild(label);
    line.appendChild(body);
  }
  chatDiv.appendChild(line);
  chatDiv.scrollTop = chatDiv.scrollHeight;
  return line;
}

function addToolCallLine(name, args) {
  const line = document.createElement("div");
  line.className = "line tool-call";
  const argStr = Object.entries(args || {})
    .map(([k, v]) => `${k}=${JSON.stringify(v)}`)
    .join(", ");
  line.textContent = `→ called ${name}(${argStr})`;
  chatDiv.appendChild(line);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function addSystemLine(text) {
  const line = document.createElement("div");
  line.className = "line system-line";
  line.textContent = text;
  chatDiv.appendChild(line);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function clearSession() {
  sessionId = crypto.randomUUID();
  chatDiv.innerHTML = "";
  threadLabel.textContent = "thread: " + sessionId.slice(0, 8);
  callCountLabel.textContent = "api calls: 0";
  addSystemLine("- new session started -");
}

async function send() {
  const message = input.value.trim();
  if (!message) return;

  if (message === "/clear" || message === "/new") {
    input.value = "";
    clearSession();
    return;
  }

  addLine("you", message);
  input.value = "";
  input.disabled = true;

  const agentLine = addLine("agent", "");
  agentLine.classList.add("streaming");
  const agentLabel = agentLine.querySelector(".agent-label");
  const bodySpan = agentLine.querySelector(".body");
  let buffered = "";
  let sawCacheHit = false;

  try {
    const res = await fetch("/chat-stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: message })
    });
    if (!res.ok || !res.body) throw new Error("request failed");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let carry = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      carry += decoder.decode(value, { stream: true });

      const events = carry.split("\n\n");
      carry = events.pop();

      for (const evt of events) {
        const line = evt.trim();
        if (!line.startsWith("data:")) continue;
        const payload = JSON.parse(line.slice(5).trim());

        if (payload.type === "tool_call") {
          agentLine.classList.remove("streaming");
          addToolCallLine(payload.name, payload.args);
          agentLine.classList.add("streaming");
        } else if (payload.type === "cache_hit") {
          sawCacheHit = true;
          const tag = document.createElement("span");
          tag.className = "cache-tag";
          tag.textContent = "(cached - no API call)";
          agentLabel.appendChild(tag);
        } else if (payload.type === "token") {
          buffered += payload.text;
          bodySpan.innerHTML = marked.parse(buffered);
          chatDiv.scrollTop = chatDiv.scrollHeight;
        } else if (payload.type === "done") {
          agentLine.classList.remove("streaming");
          if (!sawCacheHit) {
            callCountLabel.textContent = "api calls: " + payload.call_count;
          }
        } else if (payload.type === "error") {
          agentLine.classList.remove("streaming");
          showError(agentLine, payload.message);
        }
      }
    }
  } catch (err) {
    agentLine.classList.remove("streaming");
    showError(agentLine, err.message || "connection error");
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function friendlyError(raw) {
  const s = (raw || "").toLowerCase();
  if (s.includes("429") || s.includes("rate limit") || s.includes("quota") || s.includes("resource_exhausted"))
    return "You have hit the API rate limit. Wait a moment and try again.";
  if (s.includes("401") || s.includes("403") || s.includes("api key") || s.includes("unauthenticated") || s.includes("permission"))
    return "Authentication failed. Please double-check your API key in the .env file.";
  if (s.includes("404") || s.includes("model not found") || s.includes("not found"))
    return "The requested Gemini model could not be found. It may not exist or may not be available to you.";
  if (s.includes("500") || s.includes("internal") || s.includes("server error"))
    return "Gemini ran into a server error. This is usually temporary so give it another try.";
  if (s.includes("503") || s.includes("unavailable") || s.includes("overloaded"))
    return "Gemini seems to be overloaded right now. Wait a few seconds and try again.";
  if (s.includes("timeout") || s.includes("timed out") || s.includes("deadline"))
    return "The request timed out because the model took too long to respond. Try again.";
  if (s.includes("network") || s.includes("connection") || s.includes("fetch"))
    return "Could not reach the server. Make sure it is still running.";
  if (s.includes("missing session_id") || s.includes("missing message"))
    return "Something went wrong with the request. The session ID or message was missing.";
  return raw || "An unexpected error occurred.";
}

function showError(agentLine, rawMessage) {
  // remove the amber agent border — the error card has its own red border
  agentLine.style.borderLeft = "none";
  agentLine.style.paddingLeft = "0";
  agentLine.innerHTML = "";
  const card = document.createElement("div");
  card.className = "error-card";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = "error";
  const body = document.createElement("div");
  body.className = "error-body";
  body.textContent = friendlyError(rawMessage);
  card.appendChild(title);
  card.appendChild(body);
  agentLine.appendChild(card);
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
